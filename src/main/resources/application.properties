# ?? Server ????????????????????????????????????????????????????????????????????
server.port=${PORT:8080}
server.address=0.0.0.0

# ?? Timezone (IST) ????????????????????????????????????????????????????????????
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# ?? Database (PostgreSQL on Render, H2 locally) ???????????????????????????????
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./ttplatform-db}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# ?? JPA ???????????????????????????????????????????????????????????????????????
# UPDATE = safe, only adds new columns/tables, never drops existing data
# Use 'create' ONLY when you need to rebuild tables from scratch (then switch back)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# ?? Connection Pool (prevent drops on Render free tier idle) ??????????????????
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.open-in-view=false

# ?? H2 Console (disabled in production) ??????????????????????????????????????
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# ?? Clerk auth ???????????????????????????????????????????????????????????????
# Issuer from Clerk Dashboard > API Keys (e.g. https://your-app.clerk.accounts.dev,
# or your production Frontend API domain once you add a custom domain in Clerk)
clerk.issuer=${CLERK_ISSUER:https://your-instance.clerk.accounts.dev}
# Secret key from Clerk Dashboard > API Keys — used to call the Backend API
clerk.secret-key=${CLERK_SECRET_KEY:sk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxx}

# ?? AI: Groq ??????????????????????????????????????????????????????????????????
ai.provider=groq
ai.api.key=${GROQ_API_KEY:YOUR_GROQ_KEY_HERE}
ai.ollama.url=http://localhost:11434

# ?? Logging ???????????????????????????????????????????????????????????????????
logging.level.com.tt=INFO
logging.level.org.springframework.security=WARN

# ?? Email (Gmail App Password for OTP) ???????????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-gmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

